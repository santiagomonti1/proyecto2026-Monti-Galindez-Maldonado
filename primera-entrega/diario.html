<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Santiago Monti, Luis Bautista Maldonado, Baltazar Galindez Quintana">
    <meta name="description" content="Diario personal de películas">
    <meta name="keywords" content="películas, cine, diario, reseñas">
    <title>Filmoteca | Mi diario</title>
    <link rel="icon" href="imagenes/favicon.png">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
    <script src="funciones.js"></script>
</head>
<body onload="verificarSesion(); actualizarMenu(); cargarPerfil(); cargarFavoritas(); cargarHistorial()">
    <header class="encabezado">
        <div class="contenedor">
            <img src="imagenes/favicon.png" alt="Logo Filmoteca" class="logo">
            <h1>Filmoteca</h1>

            <nav>
                <ul class="menu-lista">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li id="menu-diario"><a href="diario.html" class="activo">Mi diario</a></li>
                    <li><a href="ficha.html">Ficha</a></li>
                    <li id="menu-ingresar"><a href="login.html">Ingresar</a></li>
                    <li id="menu-salir"><a href="login.html" onclick="cerrarSesion()">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contenedor">
            <section class="perfil">
                <div class="avatar" id="perfil-avatar"></div>
                <div class="perfil-info">
                    <h2 id="perfil-nombre"></h2>
                    <p id="perfil-promedio"></p>
                </div>
            </section>

            <section>
                <h2>Tus favoritas</h2>
                <div class="grilla-tarjetas" id="favoritas"></div>
            </section>

            <section>
                <h2>Historial</h2>
                <table class="tabla-historial">
                    <caption>Películas que viste, de la más reciente a la más antigua</caption>
                    <thead>
                        <tr>
                            <th>Película</th>
                            <th>Fecha</th>
                            <th>Tu puntaje</th>
                            <th>Reseña</th>
                        </tr>
                    </thead>
                    <tbody id="historial"></tbody>
                </table>
            </section>
        </div>
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Filmoteca 2026 · Tu diario de películas</p>
        </div>
    </footer>
</body>
</html>
