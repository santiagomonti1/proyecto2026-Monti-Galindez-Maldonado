<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Santiago Monti, Luis Bautista Maldonado, Baltazar Galindez Quintana">
    <meta name="description" content="Catálogo de películas de Filmoteca">
    <meta name="keywords" content="películas, cine, catálogo, géneros">
    <title>Filmoteca | Catálogo</title>
    <link rel="icon" href="imagenes/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
    <link rel="stylesheet" href="estilos.css">
    <script src="funciones.js"></script>
</head>
<body onload="cargarCatalogo();cargarBusqueda()">
    <header class="encabezado">
        <div class="contenedor">
            <img src="imagenes/favicon.png" alt="Logo Filmoteca" class="logo">
            <h1>Filmoteca</h1>

            <nav>
                <ul class="menu-lista">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html" class="activo">Catálogo</a></li>
                    <li><a href="diario.html">Mi diario</a></li>
                    <li><a href="ficha.html">Ficha</a></li>
                    <li><a href="login.html">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contenedor">
            <h2>Catálogo</h2>

            <div class="buscador">
                <label for="buscar-catalogo">Buscar por título</label>
                <input type="text" name="titulo" id="buscar-catalogo" placeholder="Ej: Michael" size="40" maxlength="50" oninput="filtrarCatalogo()">
                <button type="button" id="boton-buscar" onclick="filtrarCatalogo()">Buscar</button>
            </div>

            <section class="lista-peliculas" id ="lista-peliculas"></section>

            <div id="sin-resultados" class="sin-resultados">
                <p class="sin-resultados-icono">!</p>
                <p><strong>No encontramos resultados.</strong></p>
                <p>Probá con otro título.</p>
            </div>
        </div>
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Filmoteca 2026 · Tu diario de películas</p>
        </div>
    </footer>
</body>
</html>
