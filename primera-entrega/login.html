<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Santiago Monti, Luis Bautista Maldonado, Baltazar Galindez Quintana">
    <meta name="description" content="Iniciá sesión en Filmoteca, tu diario personal de películas">
    <meta name="keywords" content="películas, cine, diario, iniciar sesión">
    <title>Filmoteca | Iniciar sesión</title>
    <link rel="icon" href="imagenes/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
    <link rel="stylesheet" href="estilos.css">
    <script src="funciones.js"></script>
</head>
<body>
    <header class="encabezado-login">
        <div class="contenedor">
            <h1>Filmoteca</h1>
            <p class="subtitulo">Tu diario personal de películas</p>
        </div>
    </header>

    <main>
        <div class="contenedor">
            <section class="caja-login">
                <h2>Iniciar sesión</h2>

                <div class="formulario">
                    <div class="campo">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Ej: santiago" size="30" maxlength="20">
                        <p id="error-usuario" class="mensaje-error"></p>
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" size="30" maxlength="20">
                        <p id="error-contrasena" class="mensaje-error"></p>
                    </div>

                    <button type="button" id="boton-ingresar" onclick="iniciarSesion()">Ingresar</button>
                </div>

                <p><a href="index.html">Volver al inicio</a></p>
            </section>
        </div>
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Filmoteca 2026 · Tu diario de películas</p>
        </div>
    </footer>
</body>
</html>
